<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><script src="assets/gsap.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#F7F7F2;font-family:Arial,Helvetica,sans-serif}#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#F7F7F2}.header{position:absolute;left:70px;top:50px;color:#5f816d;font-size:16px;font-weight:800;letter-spacing:.18em}.title{position:absolute;left:70px;top:110px;color:#203d32;font-size:76px;line-height:.96;font-weight:800;letter-spacing:-.07em}.wire{position:absolute;left:160px;right:160px;top:434px;height:5px;background:#b9e7c6;transform-origin:left}.nodes{position:absolute;left:70px;right:70px;top:345px;display:flex;gap:15px;z-index:1}.nodes div{flex:1;height:200px;border:2px solid #203d32;background:#fff;padding:22px;border-radius:15px;box-shadow:0 14px 24px #203d321c}.nodes small{display:block;color:#5f816d;font-size:14px;font-weight:800}.nodes b{display:block;margin-top:18px;color:#203d32;font-size:29px}.nodes span{display:block;margin-top:25px;color:#5f816d;font-size:18px}.pulse{position:absolute;left:145px;top:420px;width:34px;height:34px;background:#45a46a;border-radius:50%;box-shadow:0 0 0 12px #b9e7c668}.foot{position:absolute;left:70px;bottom:30px;color:#5f816d;font-size:16px;letter-spacing:.16em;font-weight:800}</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1280" data-height="720"><div id="header" class="clip header" data-start="0" data-duration="16" data-track-index="0">03 / THE BOUNDARY</div><div id="title" class="clip title" data-start="0" data-duration="16" data-track-index="1">One decision<br>before execution.</div><div id="wire" class="clip wire" data-start="0" data-duration="16" data-track-index="2"></div><div id="nodes" class="clip nodes" data-start="0" data-duration="16" data-track-index="3"><div><small>01<
