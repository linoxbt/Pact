<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><script src="assets/gsap.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#F7F7F2;font-family:Arial,Helvetica,sans-serif;color:#111A15}#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#F7F7F2}.full{position:absolute;inset:0;width:100%;height:100%}.eyebrow{position:absolute;left:76px;top:60px;font-size:17px;letter-spacing:.2em;font-weight:700;color:#668071}.title{position:absolute;left:75px;top:115px;font-size:78px;font-weight:800;line-height:.93;letter-spacing:-.07em}.rail{position:absolute;left:120px;right:120px;top:485px;height:7px;background:#b9e7c6}.node{position:absolute;top:420px;left:65px;width:220px;height:136px;border:3px solid #203D32;background:white;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:29px;font-weight:800;letter-spacing:-.04em}.gate{left:510px;width:260px;background:#203D32;color:white;display:block;padding-top:28px}.gate small{display:block;font-size:16px;font-weight:400;color:#b9e7c6;letter-spacing:0}.up{left:995px}.pill{position:absolute;left:100px;top:340px;padding:12px 21px;border-radius:40px;font-size:19px;font-weight:700;white-space:nowrap}.get{background:#b9e7c6;color:#203D32}.delete{background:#f9d9c9;color:#713a26;opacity:0}.decision{position:absolute;top:600px;left:465px;font-size:30px;font-weight:800;letter-spacing:-.03em;opacity:0}.allow{color:#2f8b53}.deny{color:#a24e32;font-size:27px}.note{position:absolute;bottom:25px;left:75px;font-size:12px;color:#668071;letter-spacing:.14em;font-weight:700}</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1280" data-height="720"><div id="eyebrow" class="clip eyebrow" data-start="0" data-duration="18" data-track-index="0">PACT / ENFORCEMENT</div><div id="title" class="clip ,duration:.35},12.8).fromTo('#note',{opacity:0},{opacity:1,duration:.4},14);tl.fromTo('#flow',{y:8},{y:-8,duration:18,ease:'none'},0);window.__timelines.main=tl;tl.seek(0);</script></body></html>
