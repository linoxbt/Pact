<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><script src="assets/gsap.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#203D32;font-family:Arial,Helvetica,sans-serif;color:#111A15}#root{position:relative;width:1280px;height:720px;overflow:hidden;background:#203D32}.full{position:absolute;inset:0;width:100%;height:100%}.bigword{position:absolute;left:-22px;top:-85px;color:#b9e7c6;font-size:245px;font-weight:800;line-height:1;letter-spacing:-.1em}.grid{position:absolute;left:68px;top:275px;width:715px;height:335px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:13px}.cell{background:#f7f7f2;padding:22px;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;opacity:0}.cell b{color:#203D32;font-size:29px;letter-spacing:-.045em}.cell small{color:#587461;font-size:15px}.docscard{position:absolute;left:818px;top:155px;width:415px;height:300px;overflow:hidden;border-radius:10px;border:4px solid #b9e7c6;box-shadow:0 15px 45px #04190d80}.docscard img{width:100%;height:100%;object-fit:cover;object-position:top}.statement{position:absolute;left:820px;top:485px;color:white;font-size:43px;font-weight:800;line-height:1.05;letter-spacing:-.06em}.small{position:absolute;left:70px;bottom:30px;color:#b9e7c6;font-size:12px;letter-spacing:.17em;font-weight:700}</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1280" data-height="720"><div id="word" data-layout-allow-overflow class="clip bigword" data-start="0" data-duration="18" data-track-index="0">SEE</div><div id="grid" class="clip grid" data-start="0" data-duration="18" data-track-index="1"><div class="cell"><b>Agents</b><small>registered identities</small></div><div class="cell"><b>Endpoints</b><small>enabled operations</small></div><div class="cell"><b>Grants</b><small>owner authority</small></div><div class="cell"><b>Policies</b><small>ordered rules</small></div><div class="cell"><b>API keys</b><small>scoped access</small></div><div class="cell"><b>Activity</b><small>matched rule + reason</small></div></div><div id="docs" class="clip docscard" data-start="0" data-duration="18" data-track-index="2"><img src="assets/docs-connect.png"></div><div id="statement" class="clip statement" data-start="0" data-duration="18" data-track-index="3">Every decision<br>has a reason.</div><div id="small" class="clip small" data-start="0" data-duration="18" data-track-index="4">PRIVATE HTTP ACTIVITY IS AN OPERATOR RECORD</div></div><script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.fromTo('#word',{y:-130,opacity:0},{y:0,opacity:1,duration:.8},.2).fromTo('.cell',{opacity:0,scale:.86,y:25},{opacity:1,scale:1,y:0,duration:.4,stagger:.52,ease:'power2.out'},2).fromTo('#docs',{opacity:0,x:170,rotate:5},{opacity:1,x:0,rotate:0,duration:.8},4.2).fromTo('#statement',{opacity:0,y:60},{opacity:1,y:0,duration:.7},9.5).fromTo('#small',{opacity:0},{opacity:1,duration:.5},12);tl.fromTo('img',{scale:1.07},{scale:1,duration:18,ease:'none'},0);window.__timelines.main=tl;tl.seek(0);</script></body></html>
