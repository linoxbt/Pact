name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PACT_TEST_DATABASE_URL: postgres://postgres:pact_local_only@127.0.0.1:5432/pact
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pact_local_only
          POSTGRES_DB: pact
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pact"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Console integration (isolated test identity)
        run: node apps/console/test/browser.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
